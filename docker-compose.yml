services:
  fuel-router:
    build: .

    container_name: fuel-router

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DJANGO_DB_PATH: /app/db/db.sqlite3

    restart: unless-stopped

    volumes:
      - ./db:/app/db
      - ./data:/app/data

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py import_prices data/fuel-prices-for-be-assessment.csv || true &&
      python manage.py runserver 0.0.0.0:8000
      "